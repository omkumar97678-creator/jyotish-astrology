<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1E4B" />
      <stop offset="100%" stop-color="#0D0F2B" />
    </radialGradient>

    <!-- Copper Metallic Gradient -->
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3BA63" />
      <stop offset="45%" stop-color="#E09840" />
      <stop offset="100%" stop-color="#C8822A" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with Rounded Border -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#C8822A" stroke-width="2.5" stroke-opacity="0.45" />

  <!-- Subtle Diamond Ring -->
  <polygon points="64,18 110,64 64,110 18,64" fill="none" stroke="#C8822A" stroke-width="1.2" stroke-opacity="0.3" />

  <!-- Diagonal Axis Lines -->
  <line x1="32" y1="32" x2="96" y2="96" stroke="#C8822A" stroke-width="1" stroke-opacity="0.25" />
  <line x1="32" y1="96" x2="96" y2="32" stroke="#C8822A" stroke-width="1" stroke-opacity="0.25" />

  <!-- Central Celestial 4-Point Star (✦) -->
  <path
    d="M 64 24 Q 64 64 104 64 Q 64 64 64 104 Q 64 64 24 64 Q 64 64 64 24 Z"
    fill="url(#copperGrad)"
    filter="url(#glow)"
  />

  <!-- Secondary Diagonal Star Rays -->
  <path
    d="M 64 42 Q 64 64 86 64 Q 64 64 64 86 Q 64 64 42 64 Q 64 64 64 42 Z"
    fill="#FFF5EA"
    opacity="0.65"
  />

  <!-- Center Core Dot -->
  <circle cx="64" cy="64" r="3.5" fill="#FFFDF8" />
</svg>
